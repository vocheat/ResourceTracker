name: Build

on:
  push:
    branches: [master, v1.1-beta, v1.2-beta, integration/all-versions-port]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mc1_21_0
            mc_range: "1.21.0"
            build_file: build-mc1.21.0.gradle
            java: "21"
            libs_dir: build/mc1_21_0/libs
          - profile: mc1_21_1
            mc_range: "1.21.1"
            build_file: build-mc1.21.1.gradle
            java: "21"
            libs_dir: build/mc1_21_1/libs
          - profile: mc1_21_2
            mc_range: "1.21.2"
            build_file: build-mc1.21.2.gradle
            java: "21"
            libs_dir: build/mc1_21_2/libs
          - profile: mc1_21_3
            mc_range: "1.21.3"
            build_file: build-mc1.21.3.gradle
            java: "21"
            libs_dir: build/mc1_21_3/libs
          - profile: mc1_21_4
            mc_range: "1.21.4"
            build_file: build-mc1.21.4.gradle
            java: "21"
            libs_dir: build/mc1_21_4/libs
          - profile: mc1_21_5
            mc_range: "1.21.5"
            build_file: build-mc1.21.5.gradle
            java: "21"
            libs_dir: build/mc1_21_5/libs
          - profile: mc1_21_6
            mc_range: "1.21.6"
            build_file: build-mc1.21.6.gradle
            java: "21"
            libs_dir: build/mc1_21_6/libs
          - profile: mc1_21_7
            mc_range: "1.21.7"
            build_file: build-mc1.21.7.gradle
            java: "21"
            libs_dir: build/mc1_21_7/libs
          - profile: mc1_21_8
            mc_range: "1.21.8"
            build_file: build-mc1.21.8.gradle
            java: "21"
            libs_dir: build/mc1_21_8/libs
          - profile: mc1_21_9
            mc_range: "1.21.9"
            build_file: build-mc1.21.9.gradle
            java: "21"
            libs_dir: build/mc1_21_9/libs
          - profile: mc1_21_10
            mc_range: "1.21.10"
            build_file: build-mc1.21.10.gradle
            java: "21"
            libs_dir: build/mc1_21_10/libs
          - profile: mc1_21_11
            mc_range: "1.21.11"
            build_file: build-mc1.21.11.gradle
            java: "21"
            libs_dir: build/mc1_21_11/libs
          - profile: mc26_1
            mc_range: "26.1"
            build_file: build-mc26.1.gradle
            java: "25"
            libs_dir: build/mc26_1/libs
          - profile: mc26_2
            mc_range: "26.2"
            build_file: build-mc26.2.gradle
            java: "25"
            libs_dir: build/mc26_2/libs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build ${{ matrix.profile }}
        run: ./gradlew "-PprofileBuild=${{ matrix.build_file }}" build

      - name: Find JAR
        run: |
          JAR=$(find "${{ matrix.libs_dir }}" -maxdepth 1 -name 'resourcetracker-*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          test -n "$JAR"
          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resourcetracker-mc${{ matrix.mc_range }}
          path: ${{ env.JAR_PATH }}
          if-no-files-found: error

  build-universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build universal JAR
        run: ./gradlew '-PprofileBuild=build-universal.gradle' :universal:verifyUniversalJar

      - name: Find universal JAR
        run: |
          JAR=$(find gradle-projects/universal/build/libs -maxdepth 1 -name 'resourcetracker-*-universal.jar' | head -1)
          test -n "$JAR"
          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: resourcetracker-universal
          path: ${{ env.JAR_PATH }}
          if-no-files-found: error

  smoke-universal:
    needs: build-universal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mc1210, mc: '1.21' }
          - { id: mc1211, mc: '1.21.1' }
          - { id: mc1212, mc: '1.21.2' }
          - { id: mc1213, mc: '1.21.3' }
          - { id: mc1214, mc: '1.21.4' }
          - { id: mc1215, mc: '1.21.5' }
          - { id: mc1216, mc: '1.21.6' }
          - { id: mc1217, mc: '1.21.7' }
          - { id: mc1218, mc: '1.21.8' }
          - { id: mc1219, mc: '1.21.9' }
          - { id: mc12110, mc: '1.21.10' }
          - { id: mc12111, mc: '1.21.11' }
          - { id: mc261, mc: '26.1' }
          - { id: mc262, mc: '26.2' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: resourcetracker-universal
          path: universal-artifact
      - name: Prepare headless client
        run: |
          chmod +x gradlew
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run universal JAR on Minecraft ${{ matrix.mc }}
        shell: bash
        run: |
          JAR=$(find universal-artifact -name 'resourcetracker-*-universal.jar' -print -quit)
          test -n "$JAR"
          set +e
          timeout 300s ./gradlew '-PprofileBuild=build-universal.gradle' "-PuniversalJarFile=$JAR" \
            ':platform:${{ matrix.id }}:prodUniversalClient' > smoke.log 2>&1
          result=$?
          set -e
          cat smoke.log
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then exit "$result"; fi
          grep -Fq 'UNIVERSAL_READY mc=${{ matrix.mc }} platform=${{ matrix.id }}' smoke.log
          grep -Fq 'minecraft:textures/atlas/gui.png' smoke.log
