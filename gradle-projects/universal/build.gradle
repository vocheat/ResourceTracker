import java.util.Collections

plugins { id 'base' }

def remapped = [
        'mc1210', 'mc1211', 'mc1212', 'mc1213', 'mc1214', 'mc1215',
        'mc1216', 'mc1217', 'mc1218', 'mc1219', 'mc12110', 'mc12111'
]
def named = ['mc261', 'mc262', 'mc263']
def mixinConfigs = (remapped + named).collect { "resourcetracker.${it}.quickadd.mixins.json".toString() }
def generatedMetadata = layout.buildDirectory.file('generated/resources/universal/fabric.mod.json')

tasks.register('generateUniversalMetadata') {
    def template = rootProject.file('src/universal/resources/fabric.mod.json')
    inputs.file template
    inputs.property('version', rootProject.version.toString())
    inputs.property('mixinConfigs', mixinConfigs)
    outputs.file generatedMetadata
    doLast {
        def metadata = new groovy.json.JsonSlurper().parseText(
                template.getText('UTF-8').replace('${version}', rootProject.version.toString()))
        metadata.mixins = mixinConfigs
        def output = generatedMetadata.get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n', 'UTF-8')
    }
}

def contents = { Project source, String taskName ->
    source.tasks.named(taskName).flatMap { it.archiveFile }.map { zipTree(it.asFile) }
}

tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Assemble the exact-version ResourceTracker payloads into one JAR'
    archiveBaseName = 'resourcetracker'
    archiveVersion = rootProject.version.toString()
    archiveClassifier = 'universal'
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.FAIL

    dependsOn project(':bootstrap').tasks.named('jar')
    from(contents(project(':bootstrap'), 'jar')) {
        exclude 'META-INF/MANIFEST.MF', 'fabric.mod.json'
    }
    remapped.each { id ->
        def payload = project(":platform:${id}")
        dependsOn payload.tasks.named('remapJar')
        from(contents(payload, 'remapJar')) {
            exclude 'META-INF/MANIFEST.MF', 'fabric.mod.json', 'LICENSE*'
        }
    }
    named.each { id ->
        def payload = project(":platform:${id}")
        dependsOn payload.tasks.named('jar')
        from(contents(payload, 'jar')) {
            exclude 'META-INF/MANIFEST.MF', 'fabric.mod.json', 'LICENSE*'
        }
    }
    from(rootProject.file('src/main/resources')) {
        exclude 'fabric.mod.json', 'resourcetracker.quickadd.mixins.json'
    }
    from(rootProject.file('src/universal/resources')) {
        exclude 'fabric.mod.json'
        expand version: rootProject.version
    }
    dependsOn tasks.named('generateUniversalMetadata')
    from(generatedMetadata)
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE_resourcetracker' }
    }
}

tasks.named('assemble') { dependsOn tasks.named('universalJar') }

tasks.register('verifyUniversalJar') {
    group = 'verification'
    dependsOn tasks.named('universalJar')
    doLast {
        def artifact = tasks.named('universalJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            def entries = Collections.list(zip.entries())*.name
            if (entries.count { it == 'fabric.mod.json' } != 1) {
                throw new GradleException('Universal JAR must contain exactly one fabric.mod.json')
            }
            (remapped + named).each { id ->
                def path = "net/fabricmc/resourcetracker/platform/${id}/ResourceTrackerPlatform.class"
                if (!entries.contains(path.toString())) throw new GradleException("Missing ${path} in ${artifact}")
            }
            entries.findAll { it.startsWith('net/fabricmc/resourcetracker/bootstrap/') && it.endsWith('.class') }
                    .each { entry ->
                def bytes = zip.getInputStream(zip.getEntry(entry)).bytes
                def constantPoolText = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                ['net/minecraft/', 'net/fabricmc/fabric/api/', 'com/terraformersmc/modmenu/'].each { forbidden ->
                    if (constantPoolText.contains(forbidden)) {
                        throw new GradleException("${entry} links to platform API: ${forbidden}")
                    }
                }
            }
            def metadata = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('fabric.mod.json')).getText('UTF-8'))
            if (metadata.version != rootProject.version.toString()) {
                throw new GradleException('Incorrect universal mod version')
            }
            if (metadata.mixins != mixinConfigs || entries.contains('resourcetracker.quickadd.mixins.json')) {
                throw new GradleException('Universal mixin configs must use the version dispatcher')
            }
            (remapped + named).each { id ->
                def configName = "resourcetracker.${id}.quickadd.mixins.json".toString()
                if (!entries.contains(configName)) throw new GradleException("Missing ${configName}")
                def config = new groovy.json.JsonSlurper().parseText(
                        zip.getInputStream(zip.getEntry(configName)).getText('UTF-8'))
                if (config.package != "net.fabricmc.resourcetracker.platform.${id}.mixin" ||
                        config.plugin != 'net.fabricmc.resourcetracker.bootstrap.QuickAddMixinPlugin' ||
                        config.compatibilityLevel != 'JAVA_21' || config.client != [] || config.mixins) {
                    throw new GradleException("Unsafe universal mixin config: ${configName}")
                }
                ['ContainerScreenAccessor', 'QuickAddNavigationMixin'].each { className ->
                    def path = "net/fabricmc/resourcetracker/platform/${id}/mixin/${className}.class".toString()
                    if (!entries.contains(path)) throw new GradleException("Missing ${path}")
                }
            }
            def expectedVersions = (remapped + named).collect { id ->
                project(":platform:${id}").minecraftTargetVersion
            }
            if (metadata.depends.minecraft != expectedVersions) {
                throw new GradleException('Universal supported versions do not match the compiled payloads')
            }
            new java.net.URLClassLoader([artifact.toURI().toURL()] as java.net.URL[], (ClassLoader) null).withCloseable { loader ->
                def matrix = loader.loadClass('net.fabricmc.resourcetracker.bootstrap.VersionMatrix')
                def platformId = matrix.getMethod('platformId', String)
                (remapped + named).eachWithIndex { id, index ->
                    if (platformId.invoke(null, expectedVersions[index]) != id) {
                        throw new GradleException("Incorrect bootstrap dispatch for ${expectedVersions[index]}")
                    }
                    ['client/gui/ColorPickerScreen', 'client/render/HudRenderer'].each { className ->
                        def entry = "net/fabricmc/resourcetracker/platform/${id}/${className}.class"
                        if (!entries.contains(entry.toString())) throw new GradleException("Missing interface class ${entry}")
                    }
                }
            }
            ['check': 16, 'check_small': 6].each { name, size ->
                def icon = zip.getEntry("assets/resourcetracker/textures/gui/icons/${name}.png")
                if (icon == null) throw new GradleException("Missing ${name} icon")
                def image = javax.imageio.ImageIO.read(zip.getInputStream(icon))
                if (image == null || image.width != size || image.height != size) {
                    throw new GradleException("Incorrect dimensions for ${name} icon")
                }
            }
            if (metadata.entrypoints.client !=
                    ['net.fabricmc.resourcetracker.bootstrap.ResourceTrackerBootstrap'] ||
                    metadata.entrypoints.modmenu !=
                    [[adapter: 'resourcetracker-dispatch', value: 'modmenu']]) {
                throw new GradleException('Universal entrypoints bypass the version dispatcher')
            }
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyUniversalJar') }
