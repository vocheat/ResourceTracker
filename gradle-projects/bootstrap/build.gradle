plugins { id 'java-library' }

sourceSets.main.java.srcDir rootProject.file('src/bootstrap/java')
sourceSets.main.resources.srcDirs = []

dependencies {
    compileOnly 'net.fabricmc:fabric-loader:0.18.6'
    compileOnly 'net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7'
    compileOnly 'org.ow2.asm:asm-tree:9.9'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
