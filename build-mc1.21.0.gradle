plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.7'
    id 'maven-publish'
}

ext.profile_id = 'mc1_21_0'
ext.source_profile_id = 'mc1_21_0_to_1_21_1'
ext.excluded_main_sources = ['net/fabricmc/resourcetracker/client/gui/EditScreen.java']
